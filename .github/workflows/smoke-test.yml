name: smoke-test

on:
  push:
    branches:
      - revamp/sleep-intelligence-v2
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile app.py modeling.py run.py

      - name: Train model smoke test
        run: python -c "from modeling import build_model; b=build_model(); print('rows=', len(b.data), 'mae=', round(b.test_mae, 3))"

      - name: Import web app
        run: python -c "import app; print(app.server)"

      - name: Check static dashboard files
        run: test -f index.html && test -f docs/index.html && test -f docs/styles.css && test -f docs/app.js && test -f docs/practical.js && test -f docs/experience.js

      - name: Check browser JavaScript syntax
        run: node --check docs/app.js && node --check docs/practical.js && node --check docs/experience.js

      - name: Check published entry points
        run: grep -q 'docs/experience.js' index.html && grep -q 'experience.js' docs/index.html && grep -q 'Sanaya' docs/experience.js
